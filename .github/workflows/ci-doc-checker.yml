name: CI DOC Checker
permissions:
  issues: write
  pull-requests: write
jobs:
  doc-checker:
    runs-on: ubuntu-latest
    name: DOC FILTER
    if: |
      !contains(github.event.pull_request.title, '(sync #') && !contains(github.event.pull_request.labels.*.name, 'sync') && (!startsWith(github.head_ref, github.base_ref) || !contains(github.head_ref, '-sync-'))
    outputs:
      output1: ${{ steps.doc-changes-info.outputs.doc }}
    steps:
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          doc:
          - 'docs/**'
    - name: DOC CHECK INFO
      id: doc-changes-info
      run: |
        echo "doc=${{ steps.changes.outputs.doc }}" >> $GITHUB_OUTPUT
  add-doc-label:
    needs: doc-checker
    runs-on: ubuntu-latest
    name: ADD DOC LABEL
    if: ${{ needs.doc-checker.outputs.output1 == 'true' }}
    steps:
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: add-doc-label gate"
        output1='${{ toJSON(needs.doc-checker.outputs.output1) }}'
        printf '%s\n' "DOC_CHECKER_OUTPUT1=${output1}"
      continue-on-error: true
    - name: add document label
      uses: actions-ecosystem/action-add-labels@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        labels: documentation
  markdownlint:
    runs-on: ubuntu-latest
    needs: add-doc-label
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
    - name: clean
      run: |
        rm -rf ${{ github.workspace }}
        mkdir -p ${{ github.workspace }}
    - name: BRANCH INFO
      id: branch
      run: |
        echo ${{github.base_ref}}
        echo "branch=${{github.base_ref}}" >> $GITHUB_OUTPUT
    - uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-Checkout-PR (markdownlint job)"
        pr_number='${{ toJSON(github.event.number) }}'
        base_ref='${{ toJSON(github.base_ref) }}'
        head_ref='${{ toJSON(github.head_ref) }}'
        head_sha='${{ toJSON(github.event.pull_request.head.sha) }}'
        repo='${{ toJSON(github.repository) }}'
        printf '%s\n' "PR_NUMBER=${pr_number}"
        printf '%s\n' "BASE_REF=${base_ref}"
        printf '%s\n' "HEAD_REF=${head_ref}"
        printf '%s\n' "HEAD_SHA=${head_sha}"
        printf '%s\n' "REPOSITORY=${repo}"
      continue-on-error: true
    - name: Checkout PR
      run: |
        BRANCH=${{steps.branch.outputs.branch}}
        git config --global user.name "wanpengfei-git";
        git config --global user.email "wanpengfei91@163.com";
        git checkout $BRANCH;
        git pull;
        BRANCH_NAME="${BRANCH}-${PR_NUMBER}";
        git fetch origin pull/${PR_NUMBER}/head:${BRANCH_NAME};
        git checkout $BRANCH_NAME;
        git checkout -b merge_pr;
        git merge --squash --no-edit ${BRANCH} || (echo "::error::Merge conflict, please check." && exit -1);
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
      id: changed-files
      with:
        files: |
          docs/en/**/*.md
          docs/ja/**/*.md
          docs/zh/**/*.md
        separator: ','
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre-markdownlint-sink"
        any_changed='${{ toJSON(steps.changed-files.outputs.any_changed) }}'
        all_changed='${{ toJSON(steps.changed-files.outputs.all_changed_files) }}'
        printf '%s\n' "ANY_CHANGED=${any_changed}"
        printf '%s\n' "ALL_CHANGED_FILES=${all_changed}"
        if [ -d "${GITHUB_WORKSPACE}" ]; then
          printf '%s\n' "WORKSPACE_TOP=$(ls -a "${GITHUB_WORKSPACE}" 2>/dev/null | tr '\n' ' ')"
          echo "GERALT_DBG: candidate config/module files in merged tree:"
          find "${GITHUB_WORKSPACE}" -maxdepth 4 \( -name '.markdownlint-cli2.*' -o -name '.markdownlintrc*' -o -name '*.cjs' -o -name '*.mjs' \) -print 2>/dev/null || true
        else
          echo "GERALT_DBG: workspace not present"
        fi
      continue-on-error: true
    - uses: DavidAnson/markdownlint-cli2-action@v21
      if: steps.changed-files.outputs.any_changed == 'true'
      with:
        config: docs/.markdownlint.json
        globs: ${{ steps.changed-files.outputs.all_changed_files }}
        separator: ','
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    branches:
    - main
    - branch*
