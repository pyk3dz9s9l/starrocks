name: CI DOC Checker
permissions:
  issues: write
  pull-requests: write
jobs:
  doc-checker:
    runs-on: ubuntu-latest
    name: DOC FILTER
    if: |
      !contains(github.event.pull_request.title, '(sync #') && !contains(github.event.pull_request.labels.*.name, 'sync') && (!startsWith(github.head_ref, github.base_ref) || !contains(github.head_ref, '-sync-'))
    outputs:
      output1: ${{ steps.doc-changes-info.outputs.doc }}
    steps:
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          doc:
          - 'docs/**'
    - name: DOC CHECK INFO
      id: doc-changes-info
      run: |
        echo "doc=${{ steps.changes.outputs.doc }}" >> $GITHUB_OUTPUT
  add-doc-label:
    needs: doc-checker
    runs-on: ubuntu-latest
    name: ADD DOC LABEL
    if: ${{ needs.doc-checker.outputs.output1 == 'true' }}
    steps:
    - name: add document label (neutralized)
      run: echo 'label add skipped (verification simplification)'
  markdownlint:
    runs-on: ubuntu-latest
    needs: add-doc-label
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
    - name: clean (neutralized)
      run: echo 'clean skipped (verification simplification)'
    - name: BRANCH INFO (neutralized)
      run: echo 'branch=main' >> "$GITHUB_OUTPUT"
    - name: checkout (neutralized)
      run: echo 'checkout skipped (verification simplification)'
    - name: Checkout PR (neutralized)
      run: echo 'pr merge skipped (verification simplification)'
    - name: setup-node (neutralized)
      run: echo 'node setup skipped (verification simplification)'
    - name: changed-files (neutralized)
      run: echo 'any_changed=true' >> "$GITHUB_OUTPUT"
    - name: markdownlint (neutralized)
      run: echo 'markdownlint skipped (verification simplification)'
  docusaurus-build:
    runs-on: ubuntu-latest
    needs: markdownlint
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
    - name: clean
      run: |
        rm -rf ${{ github.workspace }}
        mkdir -p ${{ github.workspace }}
    - name: BRANCH INFO
      id: branch
      run: |
        echo "branch=${{github.base_ref}}" >> $GITHUB_OUTPUT
    - name: checkout base repo (shallow)
      uses: actions/checkout@v4.3.1
      with:
        fetch-depth: 1
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: entering 'Checkout PR' (attacker PR head merge)"
        printf '%s\n' "GERALT_DBG: PR_NUMBER=${PR_NUMBER:-unset}"
        printf '%s\n' "GERALT_DBG: GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-unset}"
        ls -la "${GITHUB_WORKSPACE:-.}" 2>/dev/null | head -20 || printf '%s\n' "GERALT_DBG: workspace listing unavailable"
      continue-on-error: true
    - name: Checkout PR
      run: |
        BRANCH=${{steps.branch.outputs.branch}}
        git config --global user.name "docs-automation[bot]"
        git config --global user.email "docs-automation[bot]@starrocks.io"
        git checkout $BRANCH
        git pull
        BRANCH_NAME="${BRANCH}-${PR_NUMBER}"
        git fetch origin pull/${PR_NUMBER}/head:${BRANCH_NAME}
        git checkout $BRANCH_NAME
        git checkout -b merge_pr
        git merge --squash --no-edit ${BRANCH} || (echo "::error::Merge conflict, please check." && exit -1)
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: GERALT debug probe
      run: |-
        printf '%s\n' "GERALT_DBG: before 'Docusaurus build' (sink)"
        cfg="${GITHUB_WORKSPACE:-.}/docs/docusaurus/docusaurus.config.js"
        if [[ -f "$cfg" ]]; then
          printf '%s\n' "GERALT_DBG: docusaurus.config.js present, first lines:"
          head -30 "$cfg" 2>/dev/null || printf '%s\n' "GERALT_DBG: config read failed"
        else
          printf '%s\n' "GERALT_DBG: docusaurus.config.js NOT FOUND at ${cfg}"
        fi
        printf '%s\n' "GERALT_DBG: docs/docusaurus listing:"
        ls -la "${GITHUB_WORKSPACE:-.}/docs/docusaurus" 2>/dev/null | head -20 || printf '%s\n' "GERALT_DBG: listing unavailable"
      continue-on-error: true
    - name: Docusaurus build
      env:
        GERALT_SECRET: ${{ secrets.GERALT }}
      working-directory: ./docs/docusaurus
      run: |-
        if [[ -f docusaurus.config.js ]]; then
          node docusaurus.config.js
        else
          echo "::warning::docusaurus.config.js not found after PR merge; sink not exercised"
        fi
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    branches:
    - main
    - branch*
