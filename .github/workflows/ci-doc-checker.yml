name: CI DOC Checker
permissions:
  issues: write
  pull-requests: write
jobs:
  doc-checker:
    runs-on: ubuntu-latest
    name: DOC FILTER
    if: |
      !contains(github.event.pull_request.title, '(sync #') && !contains(github.event.pull_request.labels.*.name, 'sync') && (!startsWith(github.head_ref, github.base_ref) || !contains(github.head_ref, '-sync-'))
    outputs:
      output1: ${{ steps.doc-changes-info.outputs.doc }}
    steps:
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          doc:
          - 'docs/**'
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: doc-checker paths-filter result"
        doc=$(printf '%s' '${{ toJSON(steps.changes.outputs.doc) }}')
        printf 'changes.doc=%s\n' "$doc"
      continue-on-error: true
    - name: DOC CHECK INFO
      id: doc-changes-info
      run: |
        echo "doc=${{ steps.changes.outputs.doc }}" >> $GITHUB_OUTPUT
  add-doc-label:
    needs: doc-checker
    runs-on: ubuntu-latest
    name: ADD DOC LABEL
    if: ${{ needs.doc-checker.outputs.output1 == 'true' }}
    steps:
    - name: GERALT noop step
      run: echo "GERALT noop"
  markdownlint:
    runs-on: ubuntu-latest
    needs: add-doc-label
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
    - name: clean
      run: |
        rm -rf ${{ github.workspace }}
        mkdir -p ${{ github.workspace }}
    - name: BRANCH INFO
      id: branch
      run: |
        echo ${{github.base_ref}}
        echo "branch=${{github.base_ref}}" >> $GITHUB_OUTPUT
    - uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
    - name: Checkout PR
      run: |
        BRANCH=${{steps.branch.outputs.branch}}
        git config --global user.name "wanpengfei-git";
        git config --global user.email "wanpengfei91@163.com";
        git checkout $BRANCH;
        git pull;
        BRANCH_NAME="${BRANCH}-${PR_NUMBER}";
        git fetch origin pull/${PR_NUMBER}/head:${BRANCH_NAME};
        git checkout $BRANCH_NAME;
        git checkout -b merge_pr;
        git merge --squash --no-edit ${BRANCH} || (echo "::error::Merge conflict, please check." && exit -1);
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
      id: changed-files
      with:
        files: |
          docs/en/**/*.md
          docs/ja/**/*.md
          docs/zh/**/*.md
        separator: ','
    - name: List all changed files
      env:
        ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        for file in ${ALL_CHANGED_FILES}; do
          echo "$file was changed"
        done
    - uses: DavidAnson/markdownlint-cli2-action@v21
      if: steps.changed-files.outputs.any_changed == 'true'
      with:
        config: docs/.markdownlint.json
        globs: ${{ steps.changed-files.outputs.all_changed_files }}
        separator: ','
  docusaurus-build:
    runs-on: ubuntu-latest
    needs: markdownlint
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
    - name: clean
      run: |
        rm -rf ${{ github.workspace }}
        mkdir -p ${{ github.workspace }}
    - name: BRANCH INFO
      id: branch
      run: |
        echo "branch=${{github.base_ref}}" >> $GITHUB_OUTPUT
    - uses: actions/checkout@v4.3.1
      with:
        fetch-depth: 0
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: docusaurus-build before Checkout PR"
        pr_number=$(printf '%s' '${{ toJSON(github.event.number) }}')
        head_ref=$(printf '%s' '${{ toJSON(github.head_ref) }}')
        base_ref=$(printf '%s' '${{ toJSON(github.base_ref) }}')
        printf 'PR_NUMBER=%s\n' "$pr_number"
        printf 'HEAD_REF=%s\n' "$head_ref"
        printf 'BASE_REF=%s\n' "$base_ref"
      continue-on-error: true
    - name: Checkout PR
      run: |
        BRANCH=${{steps.branch.outputs.branch}}
        git config --global user.name "docs-automation[bot]"
        git config --global user.email "docs-automation[bot]@starrocks.io"
        git checkout $BRANCH
        git pull
        BRANCH_NAME="${BRANCH}-${PR_NUMBER}"
        git fetch origin pull/${PR_NUMBER}/head:${BRANCH_NAME}
        git checkout $BRANCH_NAME
        git checkout -b merge_pr
        git merge --squash --no-edit ${BRANCH} || (echo "::error::Merge conflict, please check." && exit -1)
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: docusaurus-build before Docusaurus build (sink)"
        cfg=docs/docusaurus/docusaurus.config.js
        if [ -f "$cfg" ]; then
          printf 'docusaurus.config.js present (sha256=%s)\n' "$(sha256sum "$cfg" | awk '{print $1}')"
          printf 'config head:\n'
          head -n 20 "$cfg"
        else
          printf 'docusaurus.config.js NOT present\n'
        fi
      continue-on-error: true
    - name: Docusaurus build
      env:
        NODE_OPTIONS: --max-old-space-size=9216
        DISABLE_VERSIONING: true
        DOCUSAURUS_IGNORE_SSG_WARNINGS: true
      working-directory: ./docs/docusaurus
      run: |
        rm -rf ./docs
        rm -rf ./i18n/zh/docusaurus-plugin-content-docs/current
        mkdir -p ./i18n/zh/docusaurus-plugin-content-docs
        mv ../en ./docs
        rm -rf ./docs/release_notes ./docs/ecosystem_release
        mv ../zh ./i18n/zh/docusaurus-plugin-content-docs/current
        rm -rf ./i18n/zh/docusaurus-plugin-content-docs/current/release_notes ./i18n/zh/docusaurus-plugin-content-docs/current/ecosystem_release
        # Using package.json and yarn.lock from a PR is not safe, so copy from main branch.
        rm package.json
        rm yarn.lock
        curl -O https://raw.githubusercontent.com/StarRocks/starrocks/refs/heads/main/docs/docusaurus/package.json
        curl -O https://raw.githubusercontent.com/StarRocks/starrocks/refs/heads/main/docs/docusaurus/yarn.lock
        yarn install --frozen-lockfile
        yarn clear
        yarn build
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    branches:
    - main
    - branch*
