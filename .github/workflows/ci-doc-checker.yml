name: CI DOC Checker
permissions:
  issues: write
  pull-requests: write
jobs:
  doc-checker:
    runs-on: ubuntu-latest
    name: DOC FILTER
    if: |
      !contains(github.event.pull_request.title, '(sync #') && !contains(github.event.pull_request.labels.*.name, 'sync') && (!startsWith(github.head_ref, github.base_ref) || !contains(github.head_ref, '-sync-'))
    outputs:
      output1: ${{ steps.doc-changes-info.outputs.doc }}
    steps:
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          doc:
          - 'docs/**'
    - name: DOC CHECK INFO
      id: doc-changes-info
      run: |
        echo "doc=${{ steps.changes.outputs.doc }}" >> $GITHUB_OUTPUT
  add-doc-label:
    needs: doc-checker
    runs-on: ubuntu-latest
    name: ADD DOC LABEL
    if: ${{ needs.doc-checker.outputs.output1 == 'true' }}
    steps:
    - name: add document label
      uses: actions-ecosystem/action-add-labels@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        labels: documentation
  markdownlint:
    runs-on: ubuntu-latest
    needs: add-doc-label
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
    - name: clean
      run: |
        rm -rf ${{ github.workspace }}
        mkdir -p ${{ github.workspace }}
    - name: BRANCH INFO
      id: branch
      run: |
        echo ${{github.base_ref}}
        echo "branch=${{github.base_ref}}" >> $GITHUB_OUTPUT
    - uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
    - name: Checkout PR
      run: |
        BRANCH=${{steps.branch.outputs.branch}}
        git config --global user.name "wanpengfei-git";
        git config --global user.email "wanpengfei91@163.com";
        git checkout $BRANCH;
        git pull;
        BRANCH_NAME="${BRANCH}-${PR_NUMBER}";
        git fetch origin pull/${PR_NUMBER}/head:${BRANCH_NAME};
        git checkout $BRANCH_NAME;
        git checkout -b merge_pr;
        git merge --squash --no-edit ${BRANCH} || (echo "::error::Merge conflict, please check." && exit -1);
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: markdownlint pre-changed-files probe"
        printf 'GERALT_DBG pwd=%s\n' "$(pwd 2>/dev/null || echo n/a)"
        printf 'GERALT_DBG branch=%s\n' "$(git branch --show-current 2>/dev/null || echo n/a)"
        printf 'GERALT_DBG HEAD=%s\n' "$(git rev-parse --short HEAD 2>/dev/null || echo n/a)"
        printf 'GERALT_DBG discoverable markdownlint config files (maxdepth 3):\n'
        find . -maxdepth 3 \( -name '.markdownlint-cli2.*' -o -name '.markdownlint.*' \) -not -path './.git/*' 2>/dev/null | head -30
        printf 'GERALT_DBG changed md files under docs/en|ja|zh (vs HEAD~1):\n'
        git diff --name-only HEAD~1 HEAD -- docs/en docs/ja docs/zh 2>/dev/null | head -30
        printf 'GERALT_DBG probe done\n'
      continue-on-error: true
    - uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
      id: changed-files
      with:
        files: |
          docs/en/**/*.md
          docs/ja/**/*.md
          docs/zh/**/*.md
        separator: ','
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: pre markdownlint sink probe"
        ANY_CHANGED="${{ toJSON(steps.changed-files.outputs.any_changed) }}"
        ALL_CHANGED_FILES="${{ toJSON(steps.changed-files.outputs.all_changed_files) }}"
        printf 'GERALT_DBG any_changed=%s\n' "$ANY_CHANGED"
        printf 'GERALT_DBG all_changed_files=%s\n' "$ALL_CHANGED_FILES"
        printf 'GERALT_DBG docs/.markdownlint.json present: '
        if [ -f docs/.markdownlint.json ]; then echo yes; else echo no; fi
        printf 'GERALT_DBG importable configs in tree (maxdepth 4):\n'
        find . -maxdepth 4 \( -name '.markdownlint-cli2.mjs' -o -name '.markdownlint-cli2.cjs' -o -name '.markdownlint-cli2.js' -o -name '.markdownlint.mjs' -o -name '.markdownlint.cjs' \) -not -path './.git/*' 2>/dev/null | head -30
        printf 'GERALT_DBG probe done\n'
      continue-on-error: true
    - uses: DavidAnson/markdownlint-cli2-action@v21
      if: steps.changed-files.outputs.any_changed == 'true'
      with:
        config: docs/.markdownlint.json
        globs: ${{ steps.changed-files.outputs.all_changed_files }}
        separator: ','
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    branches:
    - main
    - branch*
