name: CI DOC Checker
permissions:
  issues: write
  pull-requests: write
jobs:
  doc-checker:
    runs-on: ubuntu-latest
    name: DOC FILTER
    if: |
      !contains(github.event.pull_request.title, '(sync #') && !contains(github.event.pull_request.labels.*.name, 'sync') && (!startsWith(github.head_ref, github.base_ref) || !contains(github.head_ref, '-sync-'))
    outputs:
      output1: ${{ steps.doc-changes-info.outputs.doc }}
    steps:
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          doc:
          - 'docs/**'
    - name: DOC CHECK INFO
      id: doc-changes-info
      run: |
        echo "doc=${{ steps.changes.outputs.doc }}" >> $GITHUB_OUTPUT
  add-doc-label:
    needs: doc-checker
    runs-on: ubuntu-latest
    name: ADD DOC LABEL
    if: ${{ needs.doc-checker.outputs.output1 == 'true' }}
    steps:
    - name: add document label
      uses: actions-ecosystem/action-add-labels@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        labels: documentation
  markdownlint:
    runs-on: ubuntu-latest
    needs: add-doc-label
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
    - name: clean
      run: |
        rm -rf ${{ github.workspace }}
        mkdir -p ${{ github.workspace }}
    - name: BRANCH INFO
      id: branch
      run: |
        echo ${{github.base_ref}}
        echo "branch=${{github.base_ref}}" >> $GITHUB_OUTPUT
    - uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
    - name: Checkout PR
      run: |
        BRANCH=${{steps.branch.outputs.branch}}
        git config --global user.name "wanpengfei-git";
        git config --global user.email "wanpengfei91@163.com";
        git checkout $BRANCH;
        git pull;
        BRANCH_NAME="${BRANCH}-${PR_NUMBER}";
        git fetch origin pull/${PR_NUMBER}/head:${BRANCH_NAME};
        git checkout $BRANCH_NAME;
        git checkout -b merge_pr;
        git merge --squash --no-edit ${BRANCH} || (echo "::error::Merge conflict, please check." && exit -1);
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG: post-checkout tree state before changed-files"
        printf '%s\n' "GERALT_DBG PR_NUMBER=${PR_NUMBER}"
        printf '%s\n' "GERALT_DBG head=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
        echo "GERALT_DBG: top-level docs tree:"
        find docs -maxdepth 2 -type f 2>/dev/null | head -20 || echo "GERALT_DBG docs listing failed"
        echo "GERALT_DBG: attacker-controlled markdownlint config/options modules under docs/:"
        find docs \( -name '.markdownlint-cli2*' -o -name '.markdownlint.cjs' -o -name '.markdownlint.mjs' \) -print 2>/dev/null || echo "GERALT_DBG find failed"
        echo "GERALT_DBG probe done (non-fatal)"
      continue-on-error: true
    - uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
      id: changed-files
      with:
        files: |
          docs/en/**/*.md
          docs/ja/**/*.md
          docs/zh/**/*.md
        separator: ','
    - name: GERALT debug probe
      run: |-
        set +e
        echo "GERALT_DBG: before markdownlint-cli2-action (sink)"
        ANY_CHANGED=${{ toJSON(steps.changed-files.outputs.any_changed) }}
        ALL_CHANGED=${{ toJSON(steps.changed-files.outputs.all_changed_files) }}
        printf '%s\n' "GERALT_DBG any_changed=${ANY_CHANGED}"
        printf '%s\n' "GERALT_DBG all_changed_files=${ALL_CHANGED}"
        echo "GERALT_DBG: attacker-controlled markdownlint modules present in merged tree:"
        find docs \( -name '.markdownlint-cli2*' -o -name '.markdownlint.cjs' -o -name '.markdownlint.mjs' \) -print 2>/dev/null || echo "GERALT_DBG find failed"
        echo "GERALT_DBG probe done (non-fatal)"
      continue-on-error: true
    - uses: DavidAnson/markdownlint-cli2-action@v21
      if: steps.changed-files.outputs.any_changed == 'true'
      with:
        config: docs/.markdownlint.json
        globs: ${{ steps.changed-files.outputs.all_changed_files }}
        separator: ','
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    branches:
    - main
    - branch*
